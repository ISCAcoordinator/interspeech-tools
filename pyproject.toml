[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interspeech_tools"
version = "0.0.1"
description = "Interspeech organisation tools"
readme = {file="README.md", content-type = "text/markdown"}
authors = [
   {name="Sébastien Le Maguer", email="sebastien.lemaguer@helsinki.fi"}
]
requires-python = ">=3.11"
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: End Users/Desktop',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
]
dependencies = [
    'isca-lib>=0.1.1',
    'PyMuPDF>=1.25.5',
    'jinja2>=3.1.2',
    'unidecode>=1.3.8',
    'pyuca>=1.2',
    'pylatex'
]

[project.optional-dependencies]
dev = [
    "black",
    "basedpyright",
    "flake8",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/seblemaguer/interspeech_tools"
Issues = "https://github.com/seblemaguer/interspeech_tools/issues"
git = "https://github.com/seblemaguer/interspeech_tools.git"

[project.scripts]
is_pub="interspeech_tools.publication.__main__:main"

[tool.setuptools.package-data]
interspeech_tools = ["**/resources/**/*.*"]  # FIXME: this is a bit hardcore here

[tool.black]
line-length = 130

[tool.isort]
profile = "black"
line_length = 130

[tool.flake8]
max-line-length = 130
extend-ignore = "E203, W503"

[tool.mypy]
python_version = 3.11
warn_return_any = true
warn_unused_configs = true
disallow_untyped_calls = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pre_commit]
version = "2.15.0"
hooks = ["black", "isort", "flake8"]
